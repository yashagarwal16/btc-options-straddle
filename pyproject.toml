[project]
name = "btc-options-straddle"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "nautilus-trader==2.0.0rc8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_options_straddle"]
